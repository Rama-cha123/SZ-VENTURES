server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Charset ──────────────────────────────────────────────────────────────
    charset utf-8;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Asset Caching (immutable — hashed filenames) ─────────────────────────
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|webp|avif|png|jpg|jpeg|gif|ico)$ {
        expires     1y;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        access_log  off;
    }

    # ── XML / text files ─────────────────────────────────────────────────────
    location = /sitemap.xml {
        add_header  Cache-Control "public, max-age=86400";
        add_header  Content-Type  "application/xml; charset=utf-8";
    }

    location = /robots.txt {
        add_header  Cache-Control "public, max-age=86400";
        access_log  off;
    }

    # ── Clean URLs (extensionless routes → .html files) ──────────────────────
    location = /portfolio       { try_files /portfolio.html      =404; }
    location = /philosophy      { try_files /philosophy.html     =404; }
    location = /achievements    { try_files /achievements.html   =404; }
    location = /contact         { try_files /contact.html        =404; }
    location = /snapops         { try_files /snapops.html        =404; }
    location = /bowl-sip        { try_files /bowl-sip.html       =404; }
    location = /terramuse       { try_files /terramuse.html      =404; }
    location = /mirai           { try_files /mirai.html          =404; }
    location = /sz-manufacturing{ try_files /sz-manufacturing.html =404; }
    location = /team            { try_files /team.html           =404; }
    location = /insights        { try_files /insights.html       =404; }
    location = /careers         { try_files /careers.html        =404; }
    location = /press           { try_files /press.html          =404; }
    location = /privacy         { try_files /privacy.html        =404; }
    location = /terms           { try_files /terms.html          =404; }
    location = /cookies         { try_files /cookies.html        =404; }

    # ── Main catch-all ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 404 /index.html;

    # ── Deny hidden files (.git, .env, etc.) ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
