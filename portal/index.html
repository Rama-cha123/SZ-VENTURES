<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <title>SZ Ventures — Portal Dashboard</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;500;600;700&display=swap">
 <link rel="stylesheet" href="../assets/styles/tokens.css">
 <link rel="stylesheet" href="../assets/styles/base.css">
 <link rel="stylesheet" href="../assets/styles/components.css">
 <link rel="stylesheet" href="../assets/styles/layout.css">
 <style>
  :root {
   --sidebar-w: 260px;
  }
  body { background: var(--paper); color: var(--ink); margin: 0; padding: 0; font-family: var(--font-body); display: flex; min-height: 100vh; overflow-x: hidden; }
  
  /* Sidebar */
  .sidebar { width: var(--sidebar-w); background: var(--paper-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 1.5rem 0; flex-shrink: 0; }
  .sidebar-header { padding: 0 1.5rem 2rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; color: var(--ink); text-decoration: none; font-weight: 600; font-family: var(--font-display); }
  .sidebar-header img { height: 28px; width: 28px; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; padding: 0 1rem; }
  .nav-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-2); margin: 1rem 0 0.25rem 0.5rem; font-weight: 600; }
  .nav-item { padding: 0.6rem 1rem; border-radius: var(--radius-sm); color: var(--muted); text-decoration: none; font-size: var(--fs-400); display: flex; align-items: center; gap: 0.75rem; transition: background 0.2s, color 0.2s; }
  .nav-item:hover, .nav-item.active { background: rgba(220, 180, 110, 0.1); color: var(--gold-light); }
  .nav-item svg { width: 16px; height: 16px; color: currentcolor; }
  .sidebar-footer { padding: 1.5rem; border-top: 1px solid var(--line); }
  
  /* Main Content */
  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 72px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--paper); }
  .topbar-left h2 { margin: 0; font-size: var(--fs-600); font-weight: 500; font-family: var(--font-display); }
  .topbar-right { display: flex; align-items: center; gap: 1rem; }
  .user-profile { display: flex; align-items: center; gap: 0.75rem; color: var(--ink); font-size: var(--fs-400); font-weight: 500; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; color: var(--paper); font-weight: 600; font-size: 1rem; }
  
  /* Dashboard Layout */
  .dashboard { padding: 2rem; display: flex; flex-direction: column; gap: 2rem; overflow-y: auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
  .stat-card { background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; }
  .stat-label { font-size: var(--fs-300); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; display: block; }
  .stat-value { font-size: var(--fs-800); font-family: var(--font-serif); color: var(--ink); }
  .stat-diff { font-size: var(--fs-300); color: #4dff88; margin-top: 0.5rem; display: flex; align-items: center; gap: 0.25rem; }
  .stat-diff.negative { color: #ff4d4d; }

  /* Tables */
  .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .panel-title { margin: 0; font-size: var(--fs-500); font-weight: 600; font-family: var(--font-display); }
  .data-table { width: 100%; border-collapse: collapse; text-align: left; }
  .data-table th { padding: 1rem 1.5rem; font-size: var(--fs-300); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--line); font-weight: 500; }
  .data-table td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-400); color: var(--ink-soft); }
  .data-table tr:last-child td { border-bottom: none; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.5rem; }
  .status-active { background: #4dff88; box-shadow: 0 0 8px rgba(77, 255, 136, 0.4); }
  .status-pending { background: var(--gold-bright); box-shadow: 0 0 8px rgba(245, 215, 150, 0.4); }

  /* Mobile */
  @media (max-width: 768px) {
   .sidebar { position: fixed; transform: translateX(-100%); transition: transform 0.3s; z-index: 100; height: 100vh; }
   .sidebar.open { transform: translateX(0); }
   .mobile-toggle { display: block; background: none; border: none; color: var(--ink); cursor: pointer; }
   .topbar { padding: 0 1rem; }
   .dashboard { padding: 1rem; }
  }
  @media (min-width: 769px) {
   .mobile-toggle { display: none; }
  }
 </style>
</head>
<body>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>

   <a href="#" class="nav-item">

   <a href="#" class="nav-item">

    Reports
   </a>
   
   <div class="nav-label restricted-admin">Admin</div>
   <a href="#" class="nav-item restricted-admin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
   </a>
   <a href="#" class="nav-item restricted-admin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Access Control
   </a>
  </nav>
  <div class="sidebar-footer">
   <button id="logoutBtn" class="btn btn--ghost" style="width:100%; padding: 0.6rem; font-size: 0.8rem;">SIGN OUT</button>
  </div>
 </aside>

 <main class="main-content">
  <header class="topbar">
   <div class="topbar-left">
    <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h2>Dashboard Overview</h2>
   </div>
   <div class="topbar-right">
    <div class="user-profile">
     <div style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.2;">
      <span id="userEmail">Loading...</span>
      <span id="userRoleDisplay" style="font-size: 0.65rem; color: var(--gold); text-transform: uppercase;"></span>
     </div>
     <div class="avatar"></div>
    </div>
   </div>
  </header>

  <div class="dashboard">
   <!-- Content populated dynamically by portal.js -->
  </div>
 </main>
 
 <!-- Password Update Modal (Hidden by Default) -->
 <div id="passwordUpdateModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 2rem;">
  <div style="background: var(--paper-2); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--line); width: 100%; max-width: 400px; text-align: center;">
   <h3 style="font-family: var(--font-display); font-size: var(--fs-500); margin-bottom: 1rem;">Update Your Password</h3>
   <p style="color: var(--muted); margin-bottom: 1.5rem; font-size: var(--fs-400);">Please enter your new password below.</p>
   <form id="updatePasswordForm" style="text-align: left;">
    <div style="margin-bottom: 1rem;">
     <label style="display: block; font-size: var(--fs-300); color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase;">New Password</label>
     <input type="password" id="newPassword" required style="width: 100%; padding: 0.8rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--ink); box-sizing: border-box;">
    </div>
    <div id="updatePwdMsg" style="display: none; margin-bottom: 1rem; padding: 0.75rem; border-radius: var(--radius-sm); background: rgba(0,0,0,0.2); font-size: var(--fs-400);"></div>
    <button type="submit" class="btn btn--accent" style="width: 100%;">Update Password</button>
   </form>
  </div>
 </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="../assets/js/supabase-config.generated.js"></script>
 <script src="../assets/js/auth.js"></script>
 <script src="../assets/js/portal.js"></script>

<!-- Preloader Fail-Safe -->
<script>
  setTimeout(function() {
    var pre = document.getElementById('preloader');
    if (pre && !pre.classList.contains('is-done')) {
      pre.classList.add('is-done');
      document.body.classList.remove('is-loading');
      console.warn('Preloader fail-safe triggered. A critical asset may have failed to load.');
    }
  }, 4000);
</script>
</body>
</html>
